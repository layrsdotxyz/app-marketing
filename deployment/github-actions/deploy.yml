name: Deploy marketing origin

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write

concurrency:
  group: layrsv2-marketing-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.LAYRSV2_MARKETING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.LAYRSV2_PRIMARY_REGION }}
      - name: Publish immutable release
        run: >-
          aws s3 sync dist/
          s3://${{ vars.LAYRSV2_MARKETING_BUCKET }}/releases/${{ github.sha }}/
          --only-show-errors
          --cache-control 'public,max-age=31536000,immutable'
      - name: Promote current release
        run: >-
          aws s3 sync
          s3://${{ vars.LAYRSV2_MARKETING_BUCKET }}/releases/${{ github.sha }}/
          s3://${{ vars.LAYRSV2_MARKETING_BUCKET }}/current/
          --delete
          --only-show-errors
      - name: Make the HTML revalidate
        run: >-
          aws s3 cp dist/index.html
          s3://${{ vars.LAYRSV2_MARKETING_BUCKET }}/current/index.html
          --cache-control 'public,max-age=60,must-revalidate'
          --content-type 'text/html; charset=utf-8'
      - name: Invalidate entry document
        run: >-
          aws cloudfront create-invalidation
          --distribution-id '${{ vars.LAYRSV2_MARKETING_DISTRIBUTION_ID }}'
          --paths '/index.html' '/'
