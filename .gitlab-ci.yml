stages: [fast, full, deploy]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true
  tags: [layrs, fast, x86]
  cache:
    key: { files: [package-lock.json] }
    paths: [.npm/]

marketing-fast:
  stage: fast
  script:
    - npm ci --ignore-scripts --cache .npm --prefer-offline
    - npm run check
    - npm test

marketing-full:
  stage: full
  needs: [marketing-fast]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - npm ci --ignore-scripts --cache .npm --prefer-offline
    - npm run build
    - |
      if git grep -I -n -E '(ghp_[A-Za-z0-9_]{20,}|privy_app_secret_[A-Za-z0-9]{20,}|cfat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16})' -- . ':!package-lock.json'; then exit 1; fi

deploy-production:
  stage: deploy
  tags: [layrs, deploy, x86]
  interruptible: false
  needs: [marketing-full]
  resource_group: production-app-marketing
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
  variables:
    LAYRSV2_PRIMARY_REGION: us-east-1
  script:
    - npm ci --ignore-scripts --cache .npm --prefer-offline
    - npm run check
    - npm test
    - npm run build
    - >-
      deployment/gitlab-deploy-static.sh
      arn:aws:iam::082223548516:role/layrs-production-marketing-deploy
      dist
      layrs-082223548516-us-east-1-production-marketing
      E950OG28C4DYF
      https://layrs.xyz/
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - deployment/releases/static-${CI_COMMIT_SHA}.json
  environment:
    name: production
    url: https://layrs.xyz

rollback-production:
  stage: deploy
  tags: [layrs, deploy, x86]
  interruptible: false
  resource_group: production-app-marketing
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
  variables:
    LAYRSV2_PRIMARY_REGION: us-east-1
  script:
    - test -n "${ROLLBACK_RELEASE_SHA:-}"
    - >-
      deployment/gitlab-rollback-static.sh
      arn:aws:iam::082223548516:role/layrs-production-marketing-deploy
      "$ROLLBACK_RELEASE_SHA"
      layrs-082223548516-us-east-1-production-marketing
      E950OG28C4DYF
      https://layrs.xyz/
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - deployment/releases/static-rollback-*.json
  environment:
    name: production
    url: https://layrs.xyz
